# 正式任务生成规则（v5 长序列版）
# 55 tasks: 10 easy + 5 medium + 35 long-horizon hard + 5 infeasible
# 核心变更：hard 目标数 8-12（16-24步），干扰物 5-8

seed: 42

colors:
  - red
  - blue
  - green
  - yellow
  - orange
  - purple
  - cyan
  - pink
  - white
  - brown
  - black
  - gray

shapes:
  - cube
  - block

containers:
  - tray
  - box
  - bowl

easy:
  count: 10
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false

medium:
  count: 5
  num_goal_objects: [2, 3]
  num_containers: [1, 2]
  num_distractors: [1, 2]
  dual_arm: false
  ambiguous_instruction: false

hard:
  count: 35
  num_goal_objects: [8, 12]
  num_containers: [2, 3]
  num_distractors: [5, 8]
  dual_arm: true
  ambiguous_instruction: false
  ambiguity_rate: 0.0

infeasible:
  count: 5
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false
