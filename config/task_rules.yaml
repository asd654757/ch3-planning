# 正式任务生成规则（冻结版 2026-09-08）
# 40 tasks: 10 easy + 10 medium + 15 hard + 5 infeasible
# 注意: non_table_initial 和 intermediate_clearance 需要模拟器扩展支持
#       （当前 pick 前置条件只允许从 table 上拾取），暂不启用

seed: 42

colors:
  - red
  - blue
  - green
  - yellow
  - orange
  - purple
  - cyan
  - pink
  - white
  - brown

shapes:
  - cube
  - block

containers:
  - tray
  - box
  - bowl

easy:
  count: 10
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false

medium:
  count: 10
  num_goal_objects: [1, 2]
  num_containers: [1, 2]
  num_distractors: [0, 1, 2]
  dual_arm: false
  ambiguous_instruction: false

hard:
  count: 15
  num_goal_objects: [2, 3]
  num_containers: [1, 2]
  num_distractors: [2, 3, 4]
  dual_arm: true
  ambiguous_instruction: true

infeasible:
  count: 5
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false
