# 正式任务生成规则（v3 极限难度版）
# 45 tasks: 10 easy + 10 medium + 20 hard + 5 infeasible
# 变更：hard 模糊率 100%，干扰物 5-8，模糊指令不带颜色

seed: 42

colors:
  - red
  - blue
  - green
  - yellow
  - orange
  - purple
  - cyan
  - pink
  - white
  - brown

shapes:
  - cube
  - block

containers:
  - tray
  - box
  - bowl

easy:
  count: 10
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false

medium:
  count: 10
  num_goal_objects: [1, 2]
  num_containers: [1, 2]
  num_distractors: [0, 1, 2]
  dual_arm: false
  ambiguous_instruction: false

hard:
  count: 20
  num_goal_objects: [2, 4]
  num_containers: [1, 2]
  num_distractors: [5, 8]
  dual_arm: true
  ambiguous_instruction: true
  ambiguity_rate: 1.0

infeasible:
  count: 5
  num_goal_objects: 1
  num_containers: 1
  num_distractors: 0
  dual_arm: false
  ambiguous_instruction: false
